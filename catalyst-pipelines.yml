version: 1

jobs:
  validate-loan-assistant:
    steps:
      - echo "Starting Loan Assistant CI"

      - echo "Checking Python"
      - python3 --version
      - whoami

      - echo "Installing pip"
      - apt-get update
      - apt-get install -y python3-pip

      - echo "Verifying pip"
      - python3 -m pip --version

      - echo "Checking Loan Assistant files"
      - test -f app.py
      - test -f requirements.txt
      - test -f multiformated_reconciliation.py
      - test -f module_aggregator.py
      - test -d bank_parser

      - echo "Loan Assistant environment check completed"

stages:
  - name: build-and-test
    jobs:
      - validate-loan-assistant