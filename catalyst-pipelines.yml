version: 1

images:
  python311:
    image: python:3.11-slim
    auth:
      username: << env.DOCKERHUB_USERNAME >>
      password: << env.DOCKERHUB_PASSWORD >>

jobs:
  test-python-image:
    image: python311
    steps:
      - echo "Testing Loan Assistant build environment"
      - python3 --version
      - python3 -m pip --version
      - python3 -c "print('Python image working successfully')"

stages:
  - name: build
    jobs:
      - test-python-image