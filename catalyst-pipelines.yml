version: 1.0

jobs:
  python313-check:
    steps:
      - echo "Setting up Python 3.13 for Loan Assistant"

      - apt-get update
      - apt-get install -y curl ca-certificates

      - curl -LsSf https://astral.sh/uv/install.sh -o /tmp/uv-install.sh

      - env UV_INSTALL_DIR=/tmp/uv-bin sh /tmp/uv-install.sh

      - /tmp/uv-bin/uv --version

      - echo "Installing Python 3.13"
      - /tmp/uv-bin/uv python install 3.13

      - echo "Creating Python 3.13 environment"
      - /tmp/uv-bin/uv venv --python 3.13 --seed .venv

      - echo "Verifying Python version"
      - .venv/bin/python --version

      - .venv/bin/python -c "import sys; assert sys.version_info[:2] == (3, 13); print('Python 3.13 READY')"

      - echo "Loan Assistant Python environment configured successfully"

stages:
  - name: build
    jobs:
      - python313-check