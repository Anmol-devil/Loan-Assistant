version: 1.0

jobs:
  loan-assistant-build:
    steps:
      - echo "Starting Loan Assistant Python 3.13 Build"

      - echo "Installing system dependencies"
      - apt-get update
      - apt-get install -y curl ca-certificates libgomp1 libglib2.0-0 libgl1

      - echo "Installing UV"
      - curl -LsSf https://astral.sh/uv/install.sh -o /tmp/uv-install.sh
      - env UV_INSTALL_DIR=/tmp/uv-bin sh /tmp/uv-install.sh

      - echo "Installing Python 3.13"
      - /tmp/uv-bin/uv python install 3.13
      - /tmp/uv-bin/uv venv --python 3.13 --seed .venv

      - echo "Checking Python version"
      - .venv/bin/python --version
      - .venv/bin/python -c "import sys; assert sys.version_info[:2] == (3, 13); print('Python 3.13 verified')"

      - echo "Installing Loan Assistant requirements"
      - .venv/bin/python -m pip install --upgrade pip
      - .venv/bin/python -m pip install --no-cache-dir -r requirements.txt

      - echo "Checking dependency compatibility"
      - .venv/bin/python -m pip check

      - echo "Checking project syntax"
      - .venv/bin/python -m compileall -q app.py multiformated_reconciliation.py module_aggregator.py corporate_kyc_engines.py cross_document_verifier.py forensic_aggregator.py recocile_spans.py bank_parser

      - echo "Testing OCR and ONNX dependencies"
      - .venv/bin/python -c "import cv2, onnxruntime; from rapidocr import RapidOCR; from ocr_compat import ocr_engine; print('RapidOCR and ONNX imports successful')"

      - echo "Testing application imports"
      - .venv/bin/python -c "import multiformated_reconciliation, module_aggregator, corporate_kyc_engines, cross_document_verifier, forensic_aggregator; print('Loan Assistant modules imported successfully')"

      - echo "Loan Assistant build completed successfully"

stages:
  - name: build-and-test
    jobs:
      - loan-assistant-build